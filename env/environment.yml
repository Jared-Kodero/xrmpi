# xrmpi's own environment. .workspace uses its separate setup/mother.yaml.
# Complete the Conda solve before the dynamic native-library rebuild.
name: xmpi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.14
  - pip
  - setuptools>=77
  - wheel
  - cython>=3,<4
  - numpy
  - packaging
  - pkgconfig
  - cmake
  - make
  - cftime
  - certifi
  - pandas
  - scipy
  - xarray
  - dask
  - rich
  - bottleneck
